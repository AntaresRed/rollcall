<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#171B21" />
    <title>IIMPresent</title>
    <!--
      The app's opening screen, copied by hand: on show for a moment between
      Google and the app, saying what the app's loader says on either side of
      it, so the trip reads as one screen rather than three. Colours and sizes
      are the ones in src/styles.css (.splash); no web font is fetched for a
      page this brief, so it falls back to the system face.
    -->
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #F4F5F2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      .mark { filter: drop-shadow(0 8px 24px rgba(17, 21, 26, 0.16)); border-radius: 16px; }
      .word {
        margin-top: 20px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #11151A;
      }
      .word i { font-style: normal; color: #D6006F; }
      .motto {
        margin: 5px 0 0;
        font-size: 13.5px;
        font-style: italic;
        letter-spacing: -0.01em;
        color: #565E66;
      }
      .msg {
        margin: 6px 0 0;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11.5px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #666E77;
      }
      .bar {
        margin-top: 26px;
        width: 132px;
        height: 3px;
        border-radius: 2px;
        background: #E3E5E0;
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 44px;
        height: 100%;
        border-radius: 2px;
        background: #D6006F;
        transform: translateX(-44px);
      }
      .credit {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(26px + env(safe-area-inset-bottom, 0px));
        margin: 0;
        padding: 0 24px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-align: center;
        color: #565E66;
      }
      .credit b { font-weight: 600; color: #11151A; }
      @media (prefers-reduced-motion: no-preference) {
        .bar span { animation: sweep 1.15s ease-in-out infinite; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span { transform: translateX(44px); animation: breathe 1.6s ease-in-out infinite; }
      }
      @keyframes sweep {
        0%   { transform: translateX(-44px); }
        100% { transform: translateX(132px); }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.25; }
        50%      { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="mark">
    <svg width="72" height="72" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <rect width="48" height="48" rx="11" fill="#171B21" />
      <g stroke="#7A838E" stroke-width="2.4" stroke-linecap="round">
        <path d="M10 13h28" />
        <path d="M10 22h28" />
        <path d="M10 31h28" />
        <path d="M10 40h28" />
      </g>
      <path d="M13.5 28.5 L19 34 L32 17" stroke="#D6006F" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </svg>
    </div>
    <div class="word">IIM<i>Present</i></div>
    <p class="motto">No JST for classes.</p>
    <p class="msg" role="status">Drafting your mail</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p class="credit">Made by <b>Anuj Kapse</b></p>
    <!--
      Where Google sends the student after asking for Gmail permission, with
      the token in the fragment. A page of its own, outside the app, so the
      app's sign-in never sees a Google access token in its address bar and
      mistakes it for one of its own.

      It does nothing with the token but hand it over: the fragment goes into
      sessionStorage exactly as received, and src/lib/gmaildraft.js checks the
      state and reads it. Then the address bar is replaced, so the token is
      neither in history nor on screen.
    -->
    <script>
      try {
        sessionStorage.setItem("iimpresent.gmail.callback", JSON.stringify(location.hash));
      } catch (e) {
        /* the app will say the permission didn't come back */
      }
      location.replace("/?leave=draft");
    </script>
  </body>
</html>
