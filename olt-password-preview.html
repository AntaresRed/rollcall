  margin: 2px 0 14px;
}
.por-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  font-size: 12.5px;
  text-decoration: none;
}
.por-link:hover { border-color: var(--signal); color: var(--signal); }
.por-link svg { color: var(--mute); flex: 0 0 auto; }
.por-link:hover svg { color: var(--signal); }

.chip-toggle {
  border: 1px solid var(--rule-strong);
  background: var(--card);
  color: var(--slate);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12.5px;
}
.chip-toggle.on {
  background: var(--signal-wash);
  border-color: var(--signal);
  color: var(--signal-deep);
}

.dir-card {
  border-bottom: 1px solid var(--rule);
  padding: 13px 0;
}
.dir-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.dir-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.dir-courses {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 6px;
}

/* A second office block only exists for the deans, who hold two rooms and two
   numbers; the rule separates them without implying a second person. */
.dir-office + .dir-office {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--rule);
}
.dir-office-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mute);
  margin-top: 8px;
}

/* Two columns of short fields, with the email spanning both — an address is
   far too long to sit beside anything on a phone. */
.dir-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 14px;
  margin: 7px 0 0;
}
.dir-field { min-width: 0; }
.dir-field.wide { grid-column: 1 / -1; }
.dir-field dt {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--mute);
}
.dir-field dd {
  margin: 1px 0 0;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.dir-field dd a {
  color: var(--signal-deep);
  text-decoration: none;
}
.dir-field dd a:hover { text-decoration: underline; }
.dir-field dd .muted { color: var(--mute); }
/* A room with directions reads like the links beside it, plus the caret the
   venue chip uses, so "tap for more" looks the same across the app. */
.dir-room {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  color: var(--signal-deep);
  cursor: pointer;
}
.dir-room.open .venue-caret { transform: rotate(180deg); }


/* ---------- J-Maps ---------- */

/* Building names are longer than hostel codes; sized to their words rather
   than split evenly, so "CDPO Building" stays on one line on a phone. */
.map-tabs { margin-top: 14px; }
.map-tabs .mess-tab {
  flex: 1 0 auto;
  min-width: 0;
  padding: 8px 10px;
  letter-spacing: 0;
  white-space: nowrap;
}

/* The way to the building, ahead of the way to the room. A card rather than a
   line of text because it is the one thing on the screen that leaves the app. */
.map-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 13px;
  margin: 0 0 6px;
  border: 1px solid var(--rule-strong);
  border-radius: var(--r);
  background: var(--card);
}
.map-card-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.map-card-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.map-card-hint { font-size: 12.5px; line-height: 1.4; color: var(--slate); }
.map-card-go {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 11px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-size: 12.5px;
  font-weight: 500;
  text-decoration: none;
}
.map-card-go:hover { background: var(--signal-deep); }

/* Pinned just under the masthead while the rooms scroll beneath it, so the
   way to the building is a tap away from any room on the list. Searching,
   each building's card holds only while its own rooms go by, and hands over
   to the next one's.

   The pin is a strip of paper with the card inside, not the card itself:
   rows scrolling past would otherwise show in the gap above the card and at
   its rounded corners. Its top padding is that gap, taken back out of the
   margin so the card sits where it did. */
.map-pin {
  position: sticky;
  top: var(--mast-h, 52px);
  z-index: 5;
  margin-top: -8px;
  padding-top: 8px;
  background: var(--paper);
}
.map-pin .map-card { box-shadow: 0 6px 12px -8px rgba(17, 21, 26, 0.28); }

.map-group + .map-group { margin-top: 18px; }
.map-group .map-pin { margin-top: 4px; }

.map-floor {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mute);
  margin: 18px 0 2px;
}

.map-room {
  border-bottom: 1px solid var(--rule);
  padding: 10px 0;
}
.map-room-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.map-room-no { font-family: var(--mono); font-size: 13.5px; font-weight: 600; }
.map-room-name { font-size: 12px; color: var(--mute); }
.map-room-desc { margin-top: 3px; font-size: 13px; line-height: 1.45; color: var(--slate); }

.venue-note a { color: var(--signal-deep); }


/* ---------- fine print ---------- */

.fineprint {
  margin-top: 18px;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--mute);
}


/* ---------- POR dashboard ---------- */

.por-cards { display: flex; flex-direction: column; gap: 10px; }

/* The whole card is the target: a mess secretary on a phone should not have
   to find a small "Edit" link inside it. */
.por-card {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 13px 14px;
}
button.por-card { cursor: pointer; }
button.por-card:hover { border-color: var(--signal); }
/* Granted but not editable yet: present, so the owner knows it is coming,
   and visibly not a button. */
.por-card.off { background: transparent; border-style: dashed; }
.por-card.off .por-card-title { color: var(--slate); }
.por-card-text { flex: 1 1 auto; min-width: 0; }
.por-card-title { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.por-card-meta {
  display: block;
  margin-top: 3px;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--mute);
  overflow-wrap: anywhere;
}
.por-card-go { flex: 0 0 auto; font-size: 22px; line-height: 1; color: var(--mute); }

/* One part of a form: the timings, the every-day items, one day of the week. */
.por-block {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 12px 14px 14px;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.por-h {
  margin: 0;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
.por-hint { margin: -2px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--mute); }
/* Four short timings, two to a row, until the phone is too narrow to read
   "8 AM to 10:30 AM" in half its width. */
.por-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 360px) { .por-grid { grid-template-columns: 1fr; } }
.por-publish { margin-top: 16px; }

/* The admin's "see the dashboard as" switch. */
.por-viewas { margin-bottom: 14px; }
.por-viewas select {
  width: 100%;
  font: inherit;
  font-size: 14px;
  padding: 9px 11px;
  border: 1px solid var(--rule-strong);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
}
.por-viewas select:focus { outline: none; border-color: var(--signal); }

/* The guide. Read on a phone by someone who has never seen the dashboard, so
   the steps are numbered big enough to keep your place in. */
.por-p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
.por-steps,
.por-list {
  margin: 0;
  padding-left: 22px;
  font-size: 13.5px;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.por-steps li::marker { font-weight: 700; color: var(--signal-deep); }
.por-list { gap: 6px; }
/* A message quoted exactly as the screen shows it, so it can be matched by
   eye against what is in front of you. */
.por-quote {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 5px;
  padding: 0 5px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.por-faq-group {
  margin: 16px 0 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mute);
}
.por-faq {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  margin-bottom: 8px;
}
.por-faq summary {
  cursor: pointer;
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  list-style: none;
  display: flex;
  gap: 10px;
  justify-content: space-between;
}
.por-faq summary::-webkit-details-marker { display: none; }
.por-faq summary::after { content: "+"; flex: 0 0 auto; color: var(--mute); font-weight: 400; }
.por-faq[open] summary::after { content: "−"; }
.por-faq[open] summary { border-bottom: 1px solid var(--rule); }
.por-faq-a { padding: 11px 14px 13px; font-size: 13.5px; line-height: 1.55; }
.por-faq-a .por-list { margin-top: 8px; }

/* ---------- schedule admin ---------- */

.admin-live {
  background: var(--board);
  color: #fff;
  border-radius: var(--r);
  padding: 13px 15px;
  margin-bottom: 4px;
}
.admin-live-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #9AA3AD;
}
.admin-live-term {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-top: 2px;
}
.admin-live-meta {
  font-family: var(--mono);
  font-size: 11.5px;
  color: #9AA3AD;
  margin-top: 3px;
}

/* The input itself is hidden inside the label, so the whole block is the
   target rather than a stray browser-styled button beside it. */
.admin-drop {
  display: block;
  text-align: center;
  padding: 20px 16px;
  border: 1px dashed var(--rule-strong);
  border-radius: var(--r);
  background: var(--card);
  cursor: pointer;
}
.admin-drop:hover { border-color: var(--signal); }
.admin-drop input { display: none; }
.admin-drop-title { display: block; font-size: 14.5px; font-weight: 600; }
.admin-drop-sub {
  display: block;
  margin-top: 4px;
  font-size: 12.5px;
  color: var(--mute);
}
.admin-drop-sub code { font-family: var(--mono); font-size: 11.5px; }

.admin-errors {
  margin: 8px 0 0;
  padding-left: 18px;
  font-size: 13px;
  line-height: 1.5;
}

.admin-staged {
  margin-top: 12px;
  padding: 13px;
  border: 1px solid var(--rule);
  border-radius: var(--r);
  background: var(--card);
}
.admin-staged-head { display: flex; align-items: center; gap: 8px; }
.admin-staged-meta {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--slate);
  margin-top: 5px;
  line-height: 1.5;
}

.admin-row {
  display: flex;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--rule);
}
.admin-row.live { background: linear-gradient(90deg, var(--signal-wash), transparent 60%); }
.admin-row-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.admin-diff {
  margin-top: 10px;
  padding: 11px;
  border-radius: 8px;
  background: var(--paper);
  border: 1px solid var(--rule);
  font-size: 13px;
  line-height: 1.5;
}
.admin-diff em { color: var(--mute); }

/* The one difference publishing can't repair by itself, so it reads as a
   warning rather than as another line of the list. */
.admin-diff-warn {
  background: var(--warn-wash);
  color: var(--warn-ink);
  border-radius: 6px;
  padding: 9px 10px;
  margin-bottom: 9px;
}

.admin-diff-line { display: flex; gap: 10px; margin-top: 5px; }
.admin-diff-line dt {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--mute);
  padding-top: 2px;
  min-width: 92px;
}
.admin-diff-line dd {
  margin: 0;
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--ink);
}


.contact-phone {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  text-decoration: none;
  padding: 5px 9px;
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
}
.contact-phone svg { color: var(--slate); }
.contact-phone:hover { border-color: var(--signal); }
.contact-phone.muted {
  color: var(--mute);
  font-style: italic;
  border-style: dashed;
  font-family: var(--sans);
  font-size: 12.5px;
}

/* WhatsApp's own green, because that is what the button is — using the app's
   accent here would say "this is the important one", which it isn't. */
.contact-wa {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--present);
  background: var(--present-wash);
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 999px;
}
.contact-wa:hover { filter: brightness(0.96); }

@media (max-width: 460px) {
  .stu-card { align-items: flex-start; }
  .stu-actions { width: 100%; }
}


/* ---------- POR details ---------- */

/* The trail is the only thing telling you how deep you are, so it sits above
   the content rather than under it, and every step back up is one tap. */
.por-crumbs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  margin: -4px 0 14px;
  font-family: var(--mono);
  font-size: 11.5px;
}
.por-crumb-wrap { display: inline-flex; align-items: center; gap: 2px; }
.por-crumb-sep { color: var(--rule-strong); padding: 0 2px; }
.por-crumb {
  border: 0;
  background: none;
  padding: 3px 4px;
  color: var(--signal-deep);
  font: inherit;
  border-radius: 4px;
}
.por-crumb:hover:not(:disabled) { background: var(--signal-wash); }
/* The last crumb is where you already are — shown, but not a way to go there. */
.por-crumb:disabled { color: var(--slate); cursor: default; }

.por-menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* The search above the first menu. Space below it only when the menu follows;
   results bring their own count bar, which already sits clear of the box. */
.por-top-search + .por-menu { margin-top: 14px; }

/* Results from every list, grouped under the list they came from. The heading
   is also the way into that list, so it looks like the breadcrumbs above —
   the same mono, the same colour that means "you can go here". */
.por-group { margin-top: 14px; }
.por-group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 0 2px;
  border: 0;
  background: none;
  text-align: left;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--signal-deep);
}
.por-group-head span { flex: 1; min-width: 0; }
.por-group-head svg { flex: 0 0 auto; }
.por-group-head:hover { color: var(--signal); }
.por-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 15px 14px;
  background: var(--card);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--signal);
  border-radius: var(--r);
  color: var(--ink);
}
.por-item:hover { border-color: var(--signal); }
.por-item-label { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.por-item-count {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--mute);
  font-variant-numeric: tabular-nums;
}
.por-item-go { flex: 0 0 auto; color: var(--rule-strong); }

.por-section { margin-bottom: 6px; }
.por-section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0 2px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule-strong);
}

.por-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--rule);
  padding: 11px 0;
}
.por-who { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.por-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
/* The post is what people search this screen by, so it reads as a label
   rather than as an afterthought under the name. */
.por-role {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--slate);
}
.por-email {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--signal-deep);
  text-decoration: none;
  overflow-wrap: anywhere;
}
.por-email:hover { text-decoration: underline; }

.por-contact { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

@media (max-width: 460px) {
  .por-row { align-items: flex-start; }
  .por-contact { width: 100%; }
}


/* ---------- leave mail ---------- */

/* The same fields as the basket's, stacked in one card: this is a form you
   fill top to bottom once, not a list you come back to. */
.leave-form {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.leave-field { display: block; min-width: 0; }
.leave-field span,
.leave-line-label {
  display: block;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 5px;
}
.leave-field input,
.leave-field textarea {
  width: 100%;
  font: inherit;
  font-size: 14px;
  line-height: 1.4;
  padding: 9px 11px;
  border: 1px solid var(--rule-strong);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
}
/* iOS draws date and time inputs at their content width and centres the
   text; left-aligned and full width, they line up with the fields above. */
.leave-field input[type="date"],
.leave-field input[type="time"] {
  -webkit-appearance: none;
  appearance: none;
  min-height: 40px;
  text-align: left;
}
.leave-field input::-webkit-date-and-time-value { text-align: left; }
.leave-field textarea { resize: vertical; min-height: 58px; }
.leave-field input:focus,
.leave-field textarea:focus { outline: none; border-color: var(--signal); }
/* Pairs that belong together — a date and its time — side by side, until
   the phone is too narrow for either to be read back. */
/* Aligned on the boxes, not the labels: "Contact while on leave" wraps to
   two lines on a phone, and top-aligned it pushed its box below the one
   beside it. */
.leave-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  align-items: end;
}
@media (max-width: 339px) { .leave-pair { grid-template-columns: 1fr; } }
.leave-hostel { margin: 0; }

/* The mail as it will arrive: an envelope's header lines, then the body. */
.leave-mail {
  background: var(--card);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--signal);
  border-radius: var(--r);
  margin-bottom: 14px;
}
.leave-line,
.leave-body { padding: 11px 14px; border-bottom: 1px solid var(--rule); }
.leave-mail > :last-child { border-bottom: 0; }
.leave-line-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.leave-line-head .leave-line-label { margin: 0; }
.leave-line-value {
  margin-top: 3px;
  font-size: 13.5px;
  overflow-wrap: anywhere;
}
.leave-body pre {
  margin: 6px 0 0;
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.leave-copy {
  flex: 0 0 auto;
  border: 1px solid var(--rule-strong);
  background: var(--paper);
  color: var(--ink);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
}
.leave-copy:hover { border-color: var(--signal); }
.leave-pending {
  margin-top: 12px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--warn-ink);
  background: var(--warn-wash);
  border: 1px solid #ecd9b4;
  border-radius: var(--r);
}
.leave-pending p { margin: 0; }
.leave-pending p + p { margin-top: 4px; }
.leave-send { margin-top: 12px; text-align: center; text-decoration: none; }
.leave-acts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
.leave-acts .leave-send { margin-top: 0; padding-left: 10px; padding-right: 10px; }
/* The ghost style is drawn for paper; on a disabled button it would fade to
   nothing, so it keeps its border. */
.leave-acts .btn.ghost { border-color: var(--rule-strong); }
/* The finished draft: one thing left to do, said once and loudly. */
.leave-ready { margin-top: 14px; }
.leave-ready-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.leave-ready-head svg { color: var(--present); flex: none; }
.leave-ready .leave-saved { margin-top: 3px; }
.btn.leave-open {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
  padding: 14px 18px;
  font-size: 15px;
  text-decoration: none;
  background: var(--signal);
  border-color: var(--signal);
}
.btn.leave-open:hover { background: var(--signal-deep); border-color: var(--signal-deep); }
/* Two slow rings as it arrives, then still: enough to catch the eye coming
   off the loader, not a button that nags for as long as it is on screen. */
@media (prefers-reduced-motion: no-preference) {
  .leave-open { animation: beckon 1.4s ease-out 0.2s 2; }
}
@keyframes beckon {
  0%   { box-shadow: 0 0 0 0 rgba(214, 0, 111, 0.45); }
  100% { box-shadow: 0 0 0 12px rgba(214, 0, 111, 0); }
}
.leave-alt {
  display: block;
  margin: 12px auto 0;
  font-size: 13px;
  color: var(--slate);
}
.leave-saved {
  margin: 8px 0 0;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--slate);
}
.leave-saved strong { color: var(--ink); overflow-wrap: anywhere; }
.leave-retry {
  border: 0;
  background: none;
  padding: 0;
  font-size: inherit;
  color: inherit;
  text-decoration: underline;
}
.leave-copy:disabled { opacity: 0.5; cursor: default; }
/* Lower-case and unshouted beside an upper-case label, so it reads as a
   remark about the field rather than as part of its name. */
.leave-optional {
  margin-left: 6px;
  font-family: var(--sans);
  font-style: normal;
  font-size: 11px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--mute);
}
.leave-optional::before { content: "("; }
.leave-optional::after { content: ")"; }
/* Tinted in the signal colour so it reads as something to tap, not as a
   caption under the button. The disclosure's rule gives way to a box. */
.leave-draft-toggle {
  margin-top: 10px;
  padding: 11px 14px;
  background: var(--signal-wash);
  border: 1px solid #F6CFE2;
  border-radius: var(--r);
  font-family: var(--sans);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: var(--signal-deep);
}
.leave-draft-toggle:hover { border-color: var(--signal); }
.leave-draft-wait { color: var(--mute); }

/* ---------- official attendance (OLT) ---------- */

.olt-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.olt-head span {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--slate);
}
/* OLT's courses reuse the breakdown's cards. One with no dates to open is a
   plain div, so it keeps the padding a <details> card hands to its parts. */
.ab-card.olt-card { padding: 14px; }
.olt-dw-note {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--slate);
}
.olt-dw-note.warn { color: var(--warn-ink); }
/* The breakdown's OLT Sync card, between the batch total and the courses.
   In the accent colour, and the only thing on the page that is: every other
   card is the student's own record, and this is the one place that reaches
   out to another system — so it reads as the thing to act on, not one more
   course. */
.olt-sync {
  background: var(--signal-wash);
  border: 1.5px solid var(--signal);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 2px 10px rgba(214, 0, 111, 0.10);
}
.olt-sync-head {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--signal-deep);
  margin-bottom: 10px;
}
.olt-sync-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 999px;
  background: var(--signal);
  color: #fff;
}
.olt-sync .dev-flag-banner { background: #fff; }
.olt-sync-when {
  font-size: 13px;
  color: var(--slate);
  margin-bottom: 12px;
}
.olt-sync-when b { color: var(--ink); font-weight: 600; }
.olt-sync-note { font-size: 13px; color: var(--mute); }
.olt-sync-form { display: flex; flex-direction: column; gap: 10px; }
/* White boxes on the pink, so they still read as places to type. */
.olt-sync .leave-field input { background: #fff; border-color: #F0B3D2; }
.btn.olt-sync-go {
  background: var(--signal);
  border-color: var(--signal);
}
.btn.olt-sync-go:hover:not(:disabled) { background: var(--signal-deep); border-color: var(--signal-deep); }
.olt-sync-warn {
  margin-top: 10px;
  font-size: 13px;
  color: var(--warn-ink);
}

/* "Password saved": the whole of the form once there is one. */
.olt-saved {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--slate);
}
.olt-saved svg { flex: 0 0 auto; color: var(--present); }

/* The tick and what it promises, in one box: the promise is the reason to
   tick it, so it sits where the decision is made, not behind a link. */
.olt-remember {
  background: #fff;
  border: 1px solid #F0B3D2;
  border-radius: 10px;
  padding: 10px 12px;
}
.olt-remember.on { border-color: var(--signal); }
.olt-remember-tick {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
}
.olt-remember-tick input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--signal);
}
.olt-remember-how {
  margin: 8px 0 0;
  padding-left: 18px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--slate);
}
.olt-remember-how li { margin-bottom: 3px; }
.olt-remember-how li:last-child { margin-bottom: 0; }

/* Profile's "OLT password". */
.olt-pw {
  border: 1px solid var(--rule);
  border-radius: var(--r);
  background: var(--card);
  padding: 12px 14px;
}
.olt-pw-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 14px;
  font-weight: 600;
}
.olt-pw-state {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 4px 0 10px;
  font-size: 13px;
  color: var(--slate);
}
.olt-pw-state svg { flex: 0 0 auto; color: var(--present); }
.olt-pw .olt-remember-how { margin: 0; }
.olt-pw-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.olt-pw-acts .btn { flex: 1 1 0; }
.btn.ghost.olt-pw-del-start { color: var(--absent); }
.btn.olt-pw-delete { background: var(--absent); border-color: var(--absent); }
.olt-pw-confirm p { margin: 0 0 10px; font-size: 13px; color: var(--ink); }
.olt-pw-done { margin-top: 10px; font-size: 13px; color: var(--present); }

/* OLT's totals on a course card, under the student's own counts. */
.ab-olt {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 8px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed var(--rule);
  font-size: 12px;
  color: var(--slate);
}
.ab-olt-tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--mute);
}
.ab-olt b {
  font-family: var(--mono);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--present);
}
.ab-olt b.low { color: var(--absent); }

/* Two verdicts a row, OLT's then the student's, under headings that line up
   with them. Fixed widths, so a column reads straight down even when one
   side says "Did not mark" and the other "—". */
.ab-dual .ab-status {
  flex: 0 0 92px;
  min-width: 0;
  padding: 3px 4px;
  font-size: 10px;
}
.ab-status.none { color: var(--mute); }
.ab-cols { padding: 8px 0 6px; }
.ab-cols span {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--mute);
}
.ab-cols .ab-col { flex: 0 0 92px; text-align: center; }
/* OLT decides how many columns there are, so they flow rather than sit in a
   fixed grid. */
.olt-cells {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin: 6px 0 0;
  font-family: var(--mono);
  font-size: 12px;
}
.olt-cells div { display: flex; gap: 5px; }
.olt-cells dt { color: var(--mute); }
.olt-cells dd { margin: 0; color: var(--ink); }
.olt-form { margin-top: 4px; }
.olt-results { margin-top: 22px; }
.olt-form select {
  width: 100%;
  font: inherit;
  font-size: 14px;
  padding: 9px 11px;
  border: 1px solid var(--rule-strong);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
}
/* The eye sits inside the box, so the text has to stop short of it. */
.olt-pass { position: relative; }
.leave-field .olt-pass input { padding-right: 44px; }
.olt-eye {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  background: none;
  color: var(--slate);
  cursor: pointer;
  border-radius: 0 10px 10px 0;
}
.olt-eye:hover,
.olt-eye[aria-pressed="true"] { color: var(--ink); }
.olt-eye:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }
/* The login ID is shown so the phone can file the password under it, but it
   can't be changed, so it reads as information rather than a box to fill. */
.leave-field.olt-login input[readonly] {
  background: transparent;
  color: var(--slate);
  border-style: dashed;
}

/* A screen still being built, shown only to testers. Loud on purpose: it
   reads real OLT data with a real password, and a curious tap shouldn't be
   mistaken for a finished feature. */
.dev-flag {
  display: block;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--absent);
}
.btn.ghost.dev-entry {
  border-color: var(--absent);
  background: var(--absent-wash);
}
.dev-entry .dev-flag { margin-top: 3px; }
.dev-flag-banner {
  margin-bottom: 10px;
  padding: 8px 11px;
  border: 1px solid var(--absent);
  border-radius: 10px;
  background: var(--absent-wash);
  text-align: center;
}

#root { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; padding: 24px; min-height: 0; }
figure { margin: 0; }
figcaption { font: 600 14px var(--sans); margin-bottom: 8px; color: var(--ink); max-width: 375px; }
.phone { width: 375px; border: 1px solid var(--rule-strong); border-radius: 18px; overflow: clip; background: var(--paper); }
.phone .shell { padding: 16px; }
